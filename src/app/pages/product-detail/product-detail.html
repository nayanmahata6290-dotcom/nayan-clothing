<section class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-12 grid md:grid-cols-2 gap-10">

  <div class="bg-white rounded-2xl overflow-hidden shadow-sm">
    <img [src]="product?.image" class="w-full h-[520px] object-cover">
  </div>

  <div>
    <p class="text-sm text-gray-500">{{ product?.category }}</p>
    <h1 class="text-2xl font-bold mt-2">{{ product?.title }}</h1>
    <p class="text-xl font-extrabold mt-3">₹{{ product?.price }}</p>

    <div class="mt-6">
      <div class="text-sm text-gray-600 mb-2">Select Size</div>

      <div class="flex gap-2">
        <button *ngFor="let s of product?.sizes"
                (click)="selectSize(s)"
                [class]="s === selectedSize ? 'px-3 py-2 rounded border bg-black text-white' : 'px-3 py-2 rounded border bg-white text-black'">
          {{ s }}
        </button>
      </div>
    </div>

    <div class="mt-6 flex items-center gap-4">
      <div class="flex items-center border rounded">
        <button class="px-3" (click)="dec()">-</button>
        <div class="px-4">{{ quantity }}</div>
        <button class="px-3" (click)="inc()">+</button>
      </div>

      <button class="px-6 py-3 rounded-full bg-black text-white font-bold"
              (click)="addToCart()">
        Add to Cart
      </button>
    </div>

    <div class="mt-8">
      <h3 class="font-semibold">Product Details</h3>
      <p class="text-gray-600 mt-2">{{ product?.description }}</p>
    </div>
  </div>

</section>
