<section class="max-w-5xl mx-auto px-4 py-12">
  <h1 class="text-2xl font-bold mb-6">Your Cart</h1>

  <div *ngIf="items.length === 0" class="text-gray-600">
    Your cart is empty. <a routerLink="/" class="text-black underline">Shop now</a>.
  </div>

  <div *ngIf="items.length > 0" class="grid md:grid-cols-3 gap-6">
    <!-- Items column -->
    <div class="md:col-span-2 space-y-4">
      <div *ngFor="let item of items" class="flex items-center gap-4 bg-white p-4 rounded-lg shadow-sm">
        <img [src]="item.image" class="w-24 h-24 object-cover rounded" alt="{{item.title}}">
        <div class="flex-1">
          <div class="text-sm text-gray-500">{{ item.title }}</div>
          <div class="text-sm mt-1">Size: <span class="font-medium">{{ item.size || '-' }}</span></div>
          <div class="text-sm font-bold mt-2">₹{{ item.price }}</div>
        </div>

        <div class="flex flex-col items-end gap-2">
          <div class="flex items-center border rounded">
            <button class="px-3" (click)="dec(item)">-</button>
            <div class="px-4">{{ item.qty }}</div>
            <button class="px-3" (click)="inc(item)">+</button>
          </div>

          <button class="text-sm text-red-500" (click)="remove(item)">Remove</button>
        </div>
      </div>
    </div>

    <!-- Summary column -->
    <aside class="bg-white p-4 rounded-lg shadow-sm">
      <div class="flex items-center justify-between mb-4">
        <div class="text-sm text-gray-600">Subtotal</div>
        <div class="text-lg font-bold">₹{{ subtotal }}</div>
      </div>
      <div class="text-sm text-gray-600 mb-4">Shipping & taxes calculated at checkout</div>
      <a routerLink="/checkout" class="block text-center px-4 py-3 rounded-full bg-black text-white font-semibold">Proceed to Checkout</a>
      <button class="block w-full mt-3 text-center text-sm" (click)="clear()">Clear cart</button>
    </aside>
  </div>
</section>
