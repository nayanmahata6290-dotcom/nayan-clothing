<main class="min-h-screen bg-gray-50">
  <!-- Hero section -->
  <section class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-12 grid md:grid-cols-2 gap-10 items-center">
    <!-- Left side: Text -->
    <div>
      <p class="text-sm uppercase tracking-[0.2em] text-gray-500 mb-4">
        New Drop • Winter 2025
      </p>
      <h1 class="text-4xl sm:text-5xl font-bold tracking-tight mb-4">
        Wear Your <span class="underline decoration-black decoration-4">Attitude</span>.
      </h1>
      <p class="text-gray-600 mb-6">
        Premium streetwear made for everyday hustle. Clean fits, bold energy, zero compromise on comfort.
      </p>

      <div class="flex flex-wrap items-center gap-3 mb-4">
        <button class="px-6 py-3 rounded-full bg-black text-white text-sm font-medium hover:scale-105 active:scale-95 transition">
          Shop New Arrivals
        </button>
        <button class="px-6 py-3 rounded-full border border-gray-300 text-sm font-medium hover:bg-gray-100 transition">
          View Collections
        </button>
      </div>

      <div class="flex items-center gap-6 text-xs text-gray-500">
        <div class="flex items-center gap-2">
          <span class="h-2 w-2 rounded-full bg-green-500"></span>
          100% Cotton
        </div>
        <div class="flex items-center gap-2">
          <span class="h-2 w-2 rounded-full bg-green-500"></span>
          Free shipping over ₹999
        </div>
      </div>
    </div>

    <!-- Right side: Mockup / Image block -->
    <div class="relative">
      <div class="aspect-[3/4] rounded-3xl bg-gradient-to-br from-gray-900 via-gray-800 to-gray-700 shadow-xl overflow-hidden flex items-end justify-center p-6">
        <div class="text-center text-white">
          <p class="text-xs uppercase tracking-[0.25em] mb-3 text-gray-300">
            Nayan Wear
          </p>
          <p class="text-lg font-semibold mb-1">
            Oversized Drop Shoulder Tee
          </p>
          <p class="text-sm text-gray-300 mb-4">
            Starting at ₹799
          </p>
          <button class="px-5 py-2 rounded-full bg-white text-black text-xs font-semibold hover:scale-105 active:scale-95 transition">
            View product
          </button>
        </div>
      </div>

      <!-- Floating tag card -->
      <div class="absolute -top-4 -right-2 bg-white shadow-lg rounded-2xl px-4 py-3 text-xs">
        <p class="font-semibold">Trending Now</p>
        <p class="text-gray-500">+124 orders today</p>
      </div>
    </div>
  </section>

  <!-- Product grid -->
  <section class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 pb-16">
    <div class="flex items-center justify-between mb-6">
      <h2 class="text-xl font-semibold">Featured pieces</h2>
      <button class="text-sm text-gray-600 hover:text-black">
        View all
      </button>
    </div>

    <!-- DYNAMIC PRODUCT GRID -->
    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">

      <app-product-card
        *ngFor="let item of products"
        [product]="item">
      </app-product-card>

    </div>
  </section>
</main>
