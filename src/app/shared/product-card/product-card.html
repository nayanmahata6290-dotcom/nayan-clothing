<a [routerLink]="['/product', product.id]" class="block">
  <div class="bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-md transition cursor-pointer relative">

    <!-- Product Image -->
    <div class="aspect-[3/4] bg-gray-200 overflow-hidden">
      <img
        *ngIf="product?.image"
        class="w-full h-full object-cover"
        [src]="product.image"
        [alt]="product.title"
      />
    </div>

    <!-- Product Content -->
    <div class="p-3">
      <p class="text-xs text-gray-500 mb-1">{{ product?.category }}</p>
      <p class="text-sm font-semibold">{{ product?.title }}</p>
      <div class="flex items-center justify-between mt-2">
        <p class="text-sm font-bold">₹{{ product?.price }}</p>

        <!-- Quick Add button -->
        <button
          class="text-xs px-3 py-1 border rounded hover:bg-gray-100"
          (click)="quickAdd(); $event.preventDefault(); $event.stopPropagation();"
        >
          Add
        </button>
      </div>
    </div>
  </div>
</a>
