<div class="bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-md transition cursor-pointer">
  
  <!-- Product Image -->
  <div class="aspect-[3/4] bg-gray-200 overflow-hidden">
    <img
      *ngIf="product?.image"
      class="w-full h-full object-cover"
      [src]="product.image"
      [alt]="product.title"
    />
  </div>

  <!-- Product Content -->
  <div class="p-3">
    <p class="text-xs text-gray-500 mb-1">{{ product?.category }}</p>
    <p class="text-sm font-semibold">{{ product?.title }}</p>
    <p class="text-sm font-bold mt-1">₹{{ product?.price }}</p>
  </div>

</div>
